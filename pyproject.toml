[project]
name = "crivo"
version = "0.1.0"
description = "An analyst agent that remembers: kernel-resident data cleaning + query with governed, test-gated reusable skills and per-answer provenance"
readme = "README.md"
authors = [
    { name = "aarmens702-hub", email = "aarmens702@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "data-cleaning",
    "data-quality",
    "agent",
    "mcp",
    "llm",
    "provenance",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "anthropic>=0.122.0",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "matplotlib>=3.9",
    "mcp>=1.2",
    "openai>=2.53.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# read from more places without bloating the keyless core. Cloud object storage
# (fsspec: s3/gs/az), Google Sheets, and warehouses are deferred — see the
# non-goals in specs/2026-08-17-ingestion-design.md.
sql = ["sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/aarmens702-hub/analyst-agent"
Repository = "https://github.com/aarmens702-hub/analyst-agent"

[project.scripts]
crivo = "crivo:main"
crivo-mcp = "crivo.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "tdd-guard-pytest>=0.1.2",
    # test-only: exercises CleanSummary.diff()'s pandas Styler. NOT a runtime
    # dependency — the keyless core and the notebook cards never need jinja2.
    "jinja2>=3.0",
    "hypothesis>=6.167.1",
]

[tool.pytest.ini_options]
tdd_guard_project_root = "/Users/aarmensidhu/Desktop/analyst-agent"
# bench/ is repo tooling (the Proving Ground), deliberately not shipped in the
# wheel — the repo root on sys.path is what makes `import bench` work in tests
pythonpath = ["."]
# Container tests build an image and run it. That is real memory on whatever
# machine `pytest` happens to be typed on, so it must be asked for, never
# inherited: `uv run pytest -m docker` opts in.
addopts = "-m 'not docker'"
markers = ["docker: builds and runs the sandbox container; opt in explicitly"]
# The suite lives in tests/. Admitted skills each ship a scripts/test_fix.py
# whose basenames collide under repo-wide collection — those tests are run by
# the admission gate inside the kernel, never by the project suite.
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# ruff formats fenced code in markdown, and the specs' pseudocode is written for
# reading, not for running. Keep `ruff format .` off the design docs.
# skills/ holds model-authored, gate-validated artifacts: their test files use
# a `fix` name injected by the admission harness, so host-project lint rules
# structurally cannot apply to them
extend-exclude = ["specs", "docs", "skills", "*.md"]
