[project]
name = "analyst-agent"
version = "0.1.0"
description = "An analyst agent that remembers: kernel-resident data cleaning + query with governed, test-gated reusable skills and per-answer provenance"
readme = "README.md"
authors = [
    { name = "aarmens702-hub", email = "aarmens702@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "matplotlib>=3.9",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
]

[project.scripts]
analyst-agent = "analyst_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "tdd-guard-pytest>=0.1.2",
]

[tool.pytest.ini_options]
tdd_guard_project_root = "/Users/aarmensidhu/Desktop/analyst-agent"

[tool.ruff]
target-version = "py312"
