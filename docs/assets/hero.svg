<svg width="768" height="392" viewBox="0 0 768 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A terminal session: aa.diagnose finds graded problems in a CSV, aa.clean fixes the safe ones with before and after values, and prints the verification and lineage.">
  <style>
    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; white-space: pre; }
    .b { font-weight: 600; }
  </style>

  <rect x="0.5" y="0.5" width="767" height="391" rx="9" fill="#14171a" stroke="#2a2f35"/>
  <rect x="0.5" y="0.5" width="767" height="34" rx="9" fill="#1b1f24"/>
  <rect x="0.5" y="25" width="767" height="10" fill="#1b1f24"/>
  <circle cx="22" cy="17" r="5.5" fill="#e05a54"/>
  <circle cx="42" cy="17" r="5.5" fill="#d5a24f"/>
  <circle cx="62" cy="17" r="5.5" fill="#5cb98a"/>
  <text x="384" y="21" text-anchor="middle" fill="#6c7681" style="font-size:12px">transactions.csv</text>

  <!-- diagnose -->
  <text x="20" y="62"><tspan fill="#56b9c2">&gt;&gt;&gt; </tspan><tspan fill="#c7cdd3">import analyst_agent as aa</tspan></text>
  <text x="20" y="82"><tspan fill="#56b9c2">&gt;&gt;&gt; </tspan><tspan fill="#c7cdd3">report = aa.diagnose(</tspan><tspan fill="#9bd6a0">"transactions.csv"</tspan><tspan fill="#c7cdd3">)</tspan><tspan fill="#5c6771">   # no api key</tspan></text>

  <text x="20" y="110"><tspan fill="#e7e9e4" class="b">transactions.csv</tspan><tspan fill="#6c7681">   1,240 rows x 8 columns</tspan></text>
  <text x="20" y="130"><tspan fill="#5cb98a" class="b">6 fixable</tspan><tspan fill="#6c7681">    </tspan><tspan fill="#d5a24f" class="b">2 to review</tspan><tspan fill="#6c7681">    </tspan><tspan fill="#56b9c2">14 checks clear</tspan></text>

  <text x="20" y="156"><tspan fill="#5cb98a">●  </tspan><tspan fill="#5c6771">d01  </tspan><tspan fill="#c7cdd3" class="b">numbers-as-strings   </tspan><tspan fill="#56b9c2">[amount]      </tspan><tspan fill="#5cb98a">safe to auto-fix</tspan></text>
  <text x="20" y="176"><tspan fill="#5cb98a">●  </tspan><tspan fill="#5c6771">d04  </tspan><tspan fill="#c7cdd3" class="b">fake-missing-values  </tspan><tspan fill="#56b9c2">[status]      </tspan><tspan fill="#5cb98a">safe to auto-fix</tspan></text>
  <text x="20" y="196"><tspan fill="#d5a24f">●  </tspan><tspan fill="#5c6771">d07  </tspan><tspan fill="#c7cdd3" class="b">case-variants        </tspan><tspan fill="#56b9c2">[region]      </tspan><tspan fill="#d5a24f">needs a check</tspan></text>

  <!-- clean -->
  <text x="20" y="228"><tspan fill="#56b9c2">&gt;&gt;&gt; </tspan><tspan fill="#c7cdd3">clean, summary = aa.clean(report)</tspan></text>

  <text x="20" y="254"><tspan fill="#5cb98a">   fixed  </tspan><tspan fill="#c7cdd3">amount   </tspan><tspan fill="#9bd6a0">"$1,200"</tspan><tspan fill="#6c7681">   -&gt;   </tspan><tspan fill="#e7e9e4">1200.0</tspan></text>
  <text x="20" y="274"><tspan fill="#5cb98a">   fixed  </tspan><tspan fill="#c7cdd3">status   </tspan><tspan fill="#9bd6a0">"N/A"   </tspan><tspan fill="#6c7681">   -&gt;   </tspan><tspan fill="#e7e9e4">&lt;NA&gt;</tspan></text>
  <text x="20" y="294"><tspan fill="#d5a24f">   held   </tspan><tspan fill="#c7cdd3">region   </tspan><tspan fill="#6c7681">left for you (2 ambiguous fixes)</tspan></text>

  <!-- verify + lineage -->
  <line x1="20" y1="316" x2="748" y2="316" stroke="#2a2f35"/>
  <text x="20" y="340"><tspan fill="#8c95a0">every fix is re-checked. the signal goes quiet, or the fix reverts.</tspan></text>
  <text x="20" y="362"><tspan fill="#56b9c2">lineage: </tspan><tspan fill="#8c95a0">transactions.csv  -&gt;  clean.parquet  (sha 9f3a1c)</tspan></text>
</svg>
