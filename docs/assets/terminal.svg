<svg width="760" height="452" viewBox="0 0 760 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal showing analyst-agent diagnose output">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .b { font-weight: 700; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="451" rx="10" fill="#14171a" stroke="#2a2f35"/>
  <!-- title bar -->
  <rect x="0.5" y="0.5" width="759" height="38" rx="10" fill="#1b1f24"/>
  <rect x="0.5" y="28" width="759" height="11" fill="#1b1f24"/>
  <circle cx="24" cy="19" r="6" fill="#e05a54"/>
  <circle cx="46" cy="19" r="6" fill="#e0a94f"/>
  <circle cx="68" cy="19" r="6" fill="#5cb98a"/>
  <text x="380" y="23" text-anchor="middle" class="mono" fill="#6c7681">analyst-agent</text>

  <g class="mono">
    <!-- command -->
    <text x="22" y="66"><tspan fill="#5cb98a">$</tspan><tspan fill="#c7cdd3"> analyst-agent diagnose spending.csv</tspan></text>

    <!-- header rule -->
    <text x="22" y="100"><tspan fill="#e7e9e4" class="b">spending.csv</tspan><tspan fill="#6c7681">   136 rows × 9 columns  </tspan><tspan fill="#3a8f97">────────────────</tspan></text>
    <text x="22" y="122"><tspan fill="#d5a24f">⚠  not utf-8 — read as cp1252 (Windows-era export)</tspan></text>

    <!-- summary -->
    <text x="40" y="156"><tspan fill="#56b9c2" class="b">6 fixable</tspan><tspan fill="#6c7681">  ·  </tspan><tspan fill="#d5a24f" class="b">2 flagged</tspan><tspan fill="#6c7681">  ·  </tspan><tspan fill="#5cb98a" class="b">15 signals clear</tspan></text>

    <!-- finding 1 -->
    <text x="40" y="192"><tspan fill="#5cb98a">● </tspan><tspan fill="#5c6771">d01  </tspan><tspan fill="#5cb98a" class="b">numbers-as-strings</tspan><tspan fill="#56b9c2">  [Amount]</tspan></text>
    <text x="88" y="212"><tspan fill="#8c95a0">134/136 values carry currency/unit residue → float64</tspan></text>
    <text x="88" y="230"><tspan fill="#5cb98a">safe to auto-fix</tspan><tspan fill="#6c7681">  ·  confidence 1.00</tspan></text>

    <!-- finding 2 -->
    <text x="40" y="264"><tspan fill="#5cb98a">● </tspan><tspan fill="#5c6771">d06  </tspan><tspan fill="#5cb98a" class="b">whitespace-damage</tspan><tspan fill="#56b9c2">  [Account Code Description]</tspan></text>
    <text x="88" y="284"><tspan fill="#8c95a0">16/136 values carry stray whitespace (10 with NBSP)</tspan></text>
    <text x="88" y="302"><tspan fill="#5cb98a">safe to auto-fix</tspan><tspan fill="#6c7681">  ·  confidence 0.99</tspan></text>

    <!-- finding 3 gate -->
    <text x="40" y="336"><tspan fill="#d5a24f">● </tspan><tspan fill="#5c6771">d07  </tspan><tspan fill="#d5a24f" class="b">case-spelling-variants</tspan><tspan fill="#56b9c2">  [Account Code Description]</tspan></text>
    <text x="88" y="356"><tspan fill="#8c95a0">'UK air travel' ~ 'UK rail travel'</tspan></text>
    <text x="88" y="374"><tspan fill="#d5a24f">fix with a check</tspan><tspan fill="#6c7681">  ·  confidence 0.90</tspan></text>

    <!-- footer -->
    <text x="40" y="414"><tspan fill="#6c7681">checked and clean: 2-5, 8-16, 19, 22</tspan></text>
    <text x="40" y="432"><tspan fill="#5c6771" font-style="italic">22 signals run on every file — absence is a checked claim, not a silence</tspan></text>
  </g>
</svg>
