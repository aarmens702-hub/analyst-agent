<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="analyst-agent. Finds what is wrong with your data, and proves every fix. No API key, 22 checks, every fix verified.">
  <style>
    .mark { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
    .tag  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
    .meta { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.04em; }
  </style>

  <rect width="1200" height="300" fill="#0b2b30"/>

  <!-- faint ledger rules: the page this data is written on -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <line x1="0" y1="52" x2="1200" y2="52"/>
    <line x1="0" y1="104" x2="1200" y2="104"/>
    <line x1="0" y1="156" x2="1200" y2="156"/>
    <line x1="0" y1="208" x2="1200" y2="208"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
  </g>

  <!-- the mark: a ledger of records, most verified, one still under review -->
  <g>
    <rect x="72" y="92" width="108" height="116" rx="10" fill="#0e363c" stroke="#2c6b72"/>
    <!-- row 1: verified -->
    <path d="M88 116 l6 6 l11 -12" fill="none" stroke="#56b9c2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="112" width="50" height="6" rx="3" fill="#2a5a60"/>
    <!-- row 2: verified -->
    <path d="M88 140 l6 6 l11 -12" fill="none" stroke="#56b9c2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="136" width="38" height="6" rx="3" fill="#2a5a60"/>
    <!-- row 3: under review -->
    <circle cx="94" cy="164" r="4.5" fill="none" stroke="#d5a24f" stroke-width="2.2"/>
    <rect x="114" y="161" width="44" height="6" rx="3" fill="#5a4a2a"/>
    <!-- row 4: verified -->
    <path d="M88 188 l6 6 l11 -12" fill="none" stroke="#56b9c2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="184" width="30" height="6" rx="3" fill="#2a5a60"/>
  </g>

  <text x="214" y="152" class="mark" font-size="60" fill="#f2faf9">analyst-agent</text>
  <text x="216" y="192" class="tag" font-size="20" fill="#a9d6d6">finds what's wrong with your data, and proves every fix.</text>

  <line x1="216" y1="216" x2="742" y2="216" stroke="#2c6b72" stroke-width="1.4"/>
  <text x="216" y="246" class="meta" font-size="15"><tspan fill="#6fb9bf">no api key</tspan><tspan fill="#345d62">   ·   </tspan><tspan fill="#6fb9bf">22 checks</tspan><tspan fill="#345d62">   ·   </tspan><tspan fill="#6fb9bf">every fix verified</tspan></text>
</svg>
